---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emailservice
  namespace: hipster
  labels:
    app: emailservice
spec:
  selector:
    matchLabels:
      app: emailservice
  template:
    metadata:
      labels:
        app: emailservice
      annotations:
        vault.security.banzaicloud.io/vault-addr: "http://vault.vault.svc.cluster.local:8200"
        vault.security.banzaicloud.io/vault-role: "hipster"
    spec:
      serviceAccountName: emailservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: gcr.io/google-samples/microservices-demo/emailservice:v0.10.1
        ports:
        - containerPort: 8080
        env:
        - name: PORT
          value: "8080"
        - name: DISABLE_PROFILER
          value: "1"
        # Demo pattern 3 — ConfigMap with `vault:` values is mutated by the webhook using the
        # privileged vault-secrets-webhook role; the pod consumes it via plain envFrom.
        envFrom:
        - configMapRef:
            name: demo-smtp-config
        readinessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        livenessProbe:
          periodSeconds: 5
          grpc:
            port: 8080
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: emailservice
  namespace: hipster
  labels:
    app: emailservice
spec:
  type: ClusterIP
  selector:
    app: emailservice
  ports:
  - name: grpc
    port: 5000
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: emailservice
  namespace: hipster
---
# Demo pattern 3 — ConfigMap mutated by vault-secrets-webhook.
# Any value of the form `vault:<path>#<key>` is resolved at admission time.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-smtp-config
  namespace: hipster
  annotations:
    vault.security.banzaicloud.io/vault-addr: "http://vault.vault.svc.cluster.local:8200"
    vault.security.banzaicloud.io/vault-role: "vault-secrets-webhook"
data:
  SMTP_HOST: vault:secret/data/smtp#SMTP_HOST
  SMTP_USER: vault:secret/data/smtp#SMTP_USER
  SMTP_PASSWORD: vault:secret/data/smtp#SMTP_PASSWORD
