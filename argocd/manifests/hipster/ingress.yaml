---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hipster
  namespace: hipster
spec:
  ingressClassName: traefik
  rules:
  - host: hipster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              name: http
