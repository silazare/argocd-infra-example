---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adservice
  namespace: hipster
  labels:
    app: adservice
spec:
  selector:
    matchLabels:
      app: adservice
  template:
    metadata:
      labels:
        app: adservice
      annotations:
        vault.security.banzaicloud.io/vault-addr: "http://vault.vault.svc.cluster.local:8200"
        vault.security.banzaicloud.io/vault-role: "hipster"
        # Demo pattern 5 — consul-template sidecar reads this ConfigMap and renders a PKI cert
        # (from Vault's pki secrets engine) to /vault/secrets/ in a shared emptyDir.
        vault.security.banzaicloud.io/vault-ct-configmap: "demo-pki-ct-config"
    spec:
      serviceAccountName: adservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: gcr.io/google-samples/microservices-demo/adservice:v0.10.1
        ports:
        - containerPort: 9555
        env:
        - name: PORT
          value: "9555"
        resources:
          requests:
            cpu: 200m
            memory: 180Mi
          limits:
            cpu: 300m
            memory: 300Mi
        readinessProbe:
          initialDelaySeconds: 20
          periodSeconds: 15
          grpc:
            port: 9555
        livenessProbe:
          initialDelaySeconds: 20
          periodSeconds: 15
          grpc:
            port: 9555
---
apiVersion: v1
kind: Service
metadata:
  name: adservice
  namespace: hipster
  labels:
    app: adservice
spec:
  type: ClusterIP
  selector:
    app: adservice
  ports:
  - name: grpc
    port: 9555
    targetPort: 9555
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: adservice
  namespace: hipster
---
# Demo pattern 5 — consul-template config for rendering a PKI cert to disk.
# The webhook spots `vault-ct-configmap` on adservice, injects a consul-template sidecar,
# mounts this ConfigMap as its config, and shares an emptyDir at /vault/secrets with the
# main container. The sidecar re-issues the cert when it's close to expiry.
#
# The PKI backend (`pki/issue/default`) and the `default` role are defined in the Vault CR
# (externalConfig.secrets). `allow_pki` is granted to the `hipster` role so pods in this
# namespace can request certs with their own SA token.
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-pki-ct-config
  namespace: hipster
data:
  config.hcl: |
    vault {
      # VAULT_ADDR is injected into the sidecar by the webhook.
      # Auth is Kubernetes SA-based, using the pod's token (hipster role → allow_pki).
      retry {
        backoff = "1s"
      }
    }

    template {
      destination = "/vault/secrets/server.crt"
      contents    = <<-EOT
        {{- with secret "pki/issue/default" "common_name=adservice.hipster.svc" "ttl=1h" -}}
        {{ .Data.certificate }}
        {{ .Data.issuing_ca }}
        {{- end }}
      EOT
    }

    template {
      destination = "/vault/secrets/server.key"
      contents    = <<-EOT
        {{- with secret "pki/issue/default" "common_name=adservice.hipster.svc" "ttl=1h" -}}
        {{ .Data.private_key }}
        {{- end }}
      EOT
    }
