---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentservice
  namespace: hipster
  labels:
    app: paymentservice
spec:
  selector:
    matchLabels:
      app: paymentservice
  template:
    metadata:
      labels:
        app: paymentservice
      annotations:
        vault.security.banzaicloud.io/vault-addr: "http://vault.vault.svc.cluster.local:8200"
        vault.security.banzaicloud.io/vault-role: "hipster"
    spec:
      serviceAccountName: paymentservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: gcr.io/google-samples/microservices-demo/paymentservice:v0.10.1
        ports:
        - containerPort: 50051
        env:
        - name: PORT
          value: "50051"
        - name: DISABLE_PROFILER
          value: "1"
        # Demo pattern 2 — Secret with `vault:` refs is mutated in place by the webhook;
        # the pod reads a standard secretKeyRef. See demo-payment-credentials Secret below.
        - name: STRIPE_API_KEY
          valueFrom:
            secretKeyRef:
              name: demo-payment-credentials
              key: stripe-api-key
        readinessProbe:
          grpc:
            port: 50051
        livenessProbe:
          grpc:
            port: 50051
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: paymentservice
  namespace: hipster
  labels:
    app: paymentservice
spec:
  type: ClusterIP
  selector:
    app: paymentservice
  ports:
  - name: grpc
    port: 50051
    targetPort: 50051
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paymentservice
  namespace: hipster
---
# Demo pattern 2 — Secret mutated by vault-secrets-webhook.
# The `vault:` placeholder in stringData is resolved and overwritten with the real value.
apiVersion: v1
kind: Secret
metadata:
  name: demo-payment-credentials
  namespace: hipster
  annotations:
    vault.security.banzaicloud.io/vault-addr: "http://vault.vault.svc.cluster.local:8200"
    vault.security.banzaicloud.io/vault-role: "vault-secrets-webhook"
    vault.security.banzaicloud.io/mutate: "skip"
stringData:
  stripe-api-key: vault:secret/data/payment#STRIPE_API_KEY
